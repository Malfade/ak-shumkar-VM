name: greenbone-community-edition

services:
  # ─────────────────────────────────────────────────────────────────
  # Feed Data Containers (init/oneshot jobs)
  # ─────────────────────────────────────────────────────────────────
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - vt_data_vol:/mnt

  notus-data:
    image: registry.community.greenbone.net/community/notus-data
    volumes:
      - notus_data_vol:/mnt

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt

  scap-data:
    image: registry.community.greenbone.net/community/scap-data
    volumes:
      - scap_data_vol:/mnt

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data
    volumes:
      - cert_data_vol:/mnt

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_completed_successfully

  data-objects:
    image: registry.community.greenbone.net/community/data-objects
    # Required: without FEED_RELEASE, init copies all version subdirs (20.08, 24.10, …)
    # into the volume root; gvmd expects port-lists/ and scan-configs/ directly under GVMD_FEED_DIR.
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - data_objects_vol:/mnt

  report-formats:
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────────────────────────
  redis-server:
    image: registry.community.greenbone.net/community/redis-server
    restart: on-failure
    volumes:
      - redis_socket_vol:/run/redis/

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable
    restart: on-failure
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql

  # ─────────────────────────────────────────────────────────────────
  # OpenVAS Scanner (Legacy C + ospd bridge)
  # ─────────────────────────────────────────────────────────────────
  configure-openvas:
    image: openvas-custom
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' \
          'table_driven_lsc = yes' \
          'openvasd_server = http://openvasd:80' \
          'max_hosts = 30' \
          'max_checks = 96' \
          'log_whole_attack = yes' \
          'report_scripts = /var/log/openvas' \
          > /mnt/openvas.conf
        chmod 644 /mnt/openvas.conf
        mkdir -p /var/log/openvas
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log

  openvas:
    image: openvas-custom
    restart: on-failure
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/log/openvas
        touch /var/log/openvas/openvas.log
        exec tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully

  ospd-openvas:
    image: ospd-openvas-custom
    restart: on-failure
    init: true
    hostname: ospd-openvas
    environment:
      # Parallel SSH sessions (up to NASL limit); faster credentialed scans than serial reuse.
      OPENVAS_SSH_SINGLE_CONNECTION: "0"
      TINI_SUBREAPER: "1"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      - ospd-openvas
      - -f
      - --config
      - /etc/gvm/ospd-openvas.conf
      - --notus-feed-dir
      - /var/lib/notus/advisories
      - -m
      - "666"
    volumes:
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
    depends_on:
      redis-server:
        condition: service_started
      vulnerability-tests:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────────────
  # OpenVASD (new Rust daemon — local build)
  # ─────────────────────────────────────────────────────────────────
  openvasd:
    image: openvasd-custom
    restart: on-failure
    environment:
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    command:
      - /bin/sh
      - -c
      - |
        cp /opt/custom-nasl/*.nasl /var/lib/openvas/plugins/ 2>/dev/null || true
        SYNSCAN="/var/lib/openvas/plugins/2011/synscan.nasl"
        if [ -f "$$SYNSCAN" ] && ! awk '/plugin_run_udp_scanner\(\)/{found=1} END{exit found?0:1}' "$$SYNSCAN"; then
          awk '
            { print }
            /plugin_run_synscan\(\);/ && !done {
              print "plugin_run_udp_scanner();"
              done=1
            }
          ' "$$SYNSCAN" > "$${SYNSCAN}.tmp" && mv "$${SYNSCAN}.tmp" "$$SYNSCAN"
        fi
        exec /usr/local/bin/openvasd
    volumes:
      - notus_data_vol:/var/lib/notus
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
    depends_on:
      gpg-data:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - openvasd

  # ─────────────────────────────────────────────────────────────────
  # GVM Manager
  # ─────────────────────────────────────────────────────────────────
  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable
    restart: on-failure
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data
      - cert_data_vol:/var/lib/gvm/cert-data
      # Same as upstream Greenbone CE: feed containers copy port-lists, scan-configs, report-formats
      # into the volume root; gvmd expects GVMD_FEED_DIR = .../data-objects/gvmd (not .../data-objects).
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      ospd-openvas:
        condition: service_started
      scap-data:
        condition: service_completed_successfully
      cert-bund-data:
        condition: service_completed_successfully
      dfn-cert-data:
        condition: service_completed_successfully
      data-objects:
        condition: service_completed_successfully
      report-formats:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_completed_successfully
      notus-data:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully

  # ─────────────────────────────────────────────────────────────────
  # GSA HTTP Server (C proxy)
  # ─────────────────────────────────────────────────────────────────
  gsad:
    image: registry.community.greenbone.net/community/gsad:stable
    restart: on-failure
    environment:
      GSAD_ARGS: --listen=0.0.0.0 --http-only --api-only -v -f
    ports:
      - "9392:9392"
    volumes:
      - gvmd_socket_vol:/run/gvmd
    depends_on:
      gvmd:
        condition: service_started
    networks:
      default:
        aliases:
          - gsad

  # ─────────────────────────────────────────────────────────────────
  # GSA Frontend (Nginx serving React build)
  # ─────────────────────────────────────────────────────────────────
  gsa:
    image: nginx:alpine
    restart: on-failure
    ports:
      - "9393:80"
    volumes:
      - ./gsa/build:/usr/share/nginx/html:ro
      - ./gsa_nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gsad:
        condition: service_started

volumes:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  vt_data_vol:
  notus_data_vol:
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
  gvmd_data_vol:
  gvmd_socket_vol:
  psql_data_vol:
  psql_socket_vol:
